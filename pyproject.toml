[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "outputs", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# Exploratory notebooks define variables across cells and deliberately import later.
[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F811", "F821"]
